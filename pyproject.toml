[project]
name = "ComfyUI"
version = "0.3.18"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.urls]
homepage = "https://www.comfy.org/"
repository = "https://github.com/comfyanonymous/ComfyUI"
documentation = "https://docs.comfy.org/"

[project.optional-dependencies]
20250228 = [
    "aiohttp>3.11.13",
    "av>=14.2.0",
    "einops>=0.8.1",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow>=11.1.0",
    "psutil>=7.0.0",
    "pyyaml>=6.0.2",
    "safetensors>=0.4.2",
    "scipy>=1.13.1",
    "sentencepiece>=0.2.0",
    "soundfile>=0.13.1",
    "spandrel>=0.4.1",
    "tokenizers>=0.13.3",
    "torch>=2.6.0",
    "torchaudio>=2.5.1",
    "torchsde>=0.2.6",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "yarl>=1.18.0",
]
20250228-rmbg = [
    "groundingdino-py>=0.4.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=0.19.0",
    "numpy>=1.22.0",
    "opencv-python>=4.7.0",
    "pillow>=9.0.0",
    "segment-anything>=1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "transformers==4.47.0",
    "transparent-background>=1.2.4",
]
20250228-ext = [
    "matplotlib>=3.10.1",
    "numpy>=2.0.2",
    "opencv-python>=4.11.0.86",
    "pillow>=11.1.0",
]
20250228-ess = [
    "colour-science>=0.4.6",
    "numba>=0.61.0",
    "onnxruntime>=1.20.1",
    "pixeloe>=0.1.4",
    "rembg>=2.0.63",
    "transparent-background>=1.3.3",
]
20250228-devutils = [
    "aiohttp-sse>=2.2.0",
]
20250228-mgr = [
    "chardet>=5.2.0",
    "gitpython>=3.1.44",
    "huggingface-hub>0.20",
    "matrix-client==0.4.0",
    "pip>=25.0.1",
    "pygithub>=2.6.1",
    "rich>=13.9.4",
    "toml>=0.10.2",
    "transformers>=4.47.0",
    "typer>=0.15.2",
    "typing-extensions>=4.12.2",
    "uv>=0.6.3",
]
20250328 = [
    "joblib>=1.4.2",
    "polars>=1.26.0",
    "rawpy>=0.24.0",
]

[tool.ruff]
lint.select = [
  "S307", # suspicious-eval-usage
  "S102", # exec
  "T",    # print-usage
  "W",
  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
  # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
]
exclude = ["*.ipynb"]

[tool.uv.workspace]
members = ["custom_nodes/segmentation"]
